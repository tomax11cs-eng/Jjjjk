<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#667eea">
  <title>Kalkulačka CZK → EUR</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CZK → EUR">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      -webkit-tap-highlight-color: transparent;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      padding: 2rem;
      max-width: 420px;
      width: 100%;
    }
    h1 {
      margin: 0 0 1.5rem;
      font-size: 1.5rem;
      color: #2d3748;
      text-align: center;
    }
    .row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    input[type="number"] {
      flex: 1;
      padding: 0.9rem 1rem;
      font-size: 1.25rem;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
      appearance: none;
      min-width: 0;
    }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"]:focus {
      border-color: #667eea;
    }
    .currency {
      font-weight: 600;
      color: #4a5568;
      font-size: 1.1rem;
      min-width: 50px;
    }
    .swap {
      display: flex;
      justify-content: center;
      margin: 0.25rem 0;
    }
    .swap button {
      background: #edf2f7;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.25rem;
      transition: background 0.2s;
      touch-action: manipulation;
    }
    .swap button:hover { background: #cbd5e0; }
    .speak {
      display: block;
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #667eea;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      touch-action: manipulation;
    }
    .speak:hover { background: #5a67d8; }
    .speak:disabled { background: #a3bffa; cursor: default; }
    .speak[hidden] { display: none; }
    .info {
      margin-top: 1.5rem;
      padding: 0.75rem 1rem;
      background: #f7fafc;
      border-radius: 8px;
      font-size: 0.875rem;
      color: #4a5568;
      text-align: center;
    }
    .info .rate { font-weight: 600; color: #2d3748; }
    .info .date { color: #718096; font-size: 0.8rem; margin-top: 0.25rem; }
    .error {
      color: #e53e3e;
      background: #fff5f5;
      border: 1px solid #feb2b2;
    }
    .source {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.75rem;
      color: #a0aec0;
    }
    .source a { color: #667eea; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Kalkulačka CZK → EUR</h1>

    <div class="row">
      <input type="number" inputmode="decimal" id="czk" placeholder="0" step="0.01" min="0" value="100">
      <span class="currency">CZK</span>
    </div>

    <div class="swap">
      <button id="swapBtn" title="Prehodiť meny">⇅</button>
    </div>

    <div class="row">
      <input type="number" id="eur" placeholder="0" step="0.01" min="0">
      <span class="currency">EUR</span>
    </div>

    <button class="speak" id="speakBtn" type="button" hidden>🔊 Prečítať nahlas</button>

    <div class="info" id="info">Načítavam aktuálny kurz…</div>
    <div class="source">
      Zdroj: <a href="https://www.frankfurter.app" target="_blank" rel="noopener">Frankfurter API</a> (ECB, denná aktualizácia)
    </div>
  </div>

  <script>
    const czkInput = document.getElementById('czk');
    const eurInput = document.getElementById('eur');
    const info = document.getElementById('info');
    const swapBtn = document.getElementById('swapBtn');

    let rate = null;
    let direction = 'czk-to-eur';

    async function loadRate() {
      try {
        const res = await fetch('https://api.frankfurter.app/latest?from=CZK&to=EUR');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        rate = data.rates.EUR;
        info.classList.remove('error');
        info.innerHTML =
          '<div class="rate">1 CZK = ' + rate.toFixed(5) + ' EUR</div>' +
          '<div class="date">Kurz zo dňa ' + formatDate(data.date) + '</div>';
        recalculate();
      } catch (err) {
        info.classList.add('error');
        info.textContent = 'Nepodarilo sa načítať kurz: ' + err.message;
      }
    }

    function formatDate(iso) {
      const [y, m, d] = iso.split('-');
      return d + '.' + m + '.' + y;
    }

    function recalculate() {
      if (rate === null) return;
      if (direction === 'czk-to-eur') {
        const v = parseFloat(czkInput.value);
        eurInput.value = isNaN(v) ? '' : (v * rate).toFixed(2);
      } else {
        const v = parseFloat(eurInput.value);
        czkInput.value = isNaN(v) ? '' : (v / rate).toFixed(2);
      }
    }

    czkInput.addEventListener('input', () => {
      direction = 'czk-to-eur';
      recalculate();
    });
    eurInput.addEventListener('input', () => {
      direction = 'eur-to-czk';
      recalculate();
    });
    swapBtn.addEventListener('click', () => {
      const tmp = czkInput.value;
      czkInput.value = eurInput.value;
      eurInput.value = tmp;
      direction = direction === 'czk-to-eur' ? 'eur-to-czk' : 'czk-to-eur';
      recalculate();
    });

    // Hlasové čítanie výsledku (Web Speech API, slovenský hlas)
    const speakBtn = document.getElementById('speakBtn');

    function korunWord(n) {
      if (!Number.isInteger(n)) return 'koruny';
      if (n === 1) return 'koruna';
      if (n >= 2 && n <= 4) return 'koruny';
      return 'korún';
    }

    function spokenNumber(n) {
      const rounded = Math.round(n * 100) / 100;
      return Number.isInteger(rounded)
        ? String(rounded)
        : rounded.toFixed(2).replace('.', ',');
    }

    function buildSentence() {
      const czk = parseFloat(czkInput.value);
      const eur = parseFloat(eurInput.value);
      if (isNaN(czk) || isNaN(eur)) return null;
      const czkR = Math.round(czk * 100) / 100;
      const czkPart = spokenNumber(czk) + ' ' + korunWord(czkR);
      const eurPart = spokenNumber(eur) + ' eur';
      return direction === 'czk-to-eur'
        ? czkPart + (korunWord(czkR) === 'koruny' && Number.isInteger(czkR) ? ' sú ' : ' je ') + eurPart + '.'
        : eurPart + ' je ' + czkPart + '.';
    }

    function speakResult() {
      const sentence = buildSentence();
      if (!sentence) return;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(sentence);
      u.lang = 'sk-SK';
      const voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith('sk'));
      if (voice) u.voice = voice;
      speechSynthesis.speak(u);
    }

    if ('speechSynthesis' in window) {
      speakBtn.hidden = false;
      speakBtn.addEventListener('click', speakResult);
      speechSynthesis.getVoices(); // niektoré prehliadače načítajú hlasy až po prvom volaní
    }

    loadRate();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
